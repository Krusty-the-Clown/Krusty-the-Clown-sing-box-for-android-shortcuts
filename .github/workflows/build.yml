name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: 'Коммит/ветка приложения (пусто = main HEAD). Укажите SHA, если main временно не собирается.'
        required: false
        default: ''
      core_tag:
        description: 'Тег ИЛИ commit SHA ядра sing-box (пусто = автопоиск максимального beta/rc с готовым .aar)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Checkout requested app ref (if specified)
        if: ${{ github.event.inputs.app_ref != '' }}
        run: |
          echo "Переключаюсь на явно указанный ref: ${{ github.event.inputs.app_ref }}"
          git fetch origin "${{ github.event.inputs.app_ref }}" || true
          git checkout "${{ github.event.inputs.app_ref }}"

      - name: Set up Java 17 (Required for core build script)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Resolve core tag (manual override or auto beta/rc search)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MANUAL_TAG="${{ github.event.inputs.core_tag }}"

          if [ -n "$MANUAL_TAG" ]; then
            echo "Указан тег вручную: $MANUAL_TAG"
            CORE_SHA=$(gh api "repos/SagerNet/sing-box/git/ref/tags/$MANUAL_TAG" -q '.object.sha')
            if [ -z "$CORE_SHA" ] || [ "$CORE_SHA" == "null" ]; then
              echo "❌ Тег $MANUAL_TAG не найден в репозитории SagerNet/sing-box"
              exit 1
            fi
            TARGET_TAG="$MANUAL_TAG"
          else
            echo "Ищем самую свежую версию с готовым .aar-артефактом (релиз > rc > beta при равном номере)..."
            ALL_TAGS=$(gh api repos/SagerNet/sing-box/tags --paginate)
            CANDIDATES=$(echo "$ALL_TAGS" | jq -r '
              [.[] | select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-(beta|rc)\\.[0-9]+)?$"))
               | . + {parsed: (.name | capture("^v(?<maj>[0-9]+)\\.(?<min>[0-9]+)\\.(?<pat>[0-9]+)(-(?<stage>beta|rc)\\.(?<num>[0-9]+))?$"))}
               | . + {score: (
                   (.parsed.maj | tonumber) * 1000000000
                   + (.parsed.min | tonumber) * 1000000
                   + (.parsed.pat | tonumber) * 1000
                   + (if .parsed.stage == null then 900
                      elif .parsed.stage == "rc" then 500 + (.parsed.num | tonumber)
                      else (.parsed.num | tonumber) end)
                 )}
              ]
              | sort_by(-.score)
              | .[] | "\(.name) \(.commit.sha)"')

            if [ -z "$CANDIDATES" ]; then
              echo "❌ Подходящий тег не найден"
              exit 1
            fi

            TARGET_TAG=""
            while IFS= read -r line; do
              CAND_TAG=$(echo "$line" | awk '{print $1}')
              CAND_SHA=$(echo "$line" | awk '{print $2}')
              RUN_CHECK=$(gh api "repos/SagerNet/sing-box/actions/runs?head_sha=${CAND_SHA}&status=success" \
                -q '.workflow_runs[] | select(.name=="Build") | .id' | head -n1)

              if [ -z "$RUN_CHECK" ]; then
                echo "⏭️  У тега $CAND_TAG нет готовой CI-сборки Build, пробуем следующий по свежести"
                continue
              fi

              AAR_ARTIFACT=$(gh api repos/SagerNet/sing-box/actions/runs/$RUN_CHECK/artifacts \
                -q '.artifacts[] | select(.name | test("^libbox-android-"; "i")) | .name' | head -n1)

              if [ -n "$AAR_ARTIFACT" ]; then
                echo "✅ У тега $CAND_TAG есть готовый .aar-артефакт ($AAR_ARTIFACT в сборке $RUN_CHECK) — используем его"
                TARGET_TAG="$CAND_TAG"
                CORE_SHA="$CAND_SHA"
                break
              else
                echo "⏭️  У тега $CAND_TAG сборка Build есть, но .aar-артефакта среди файлов нет (только бинарники/APK), пробуем следующий"
              fi
            done <<< "$CANDIDATES"

            if [ -z "$TARGET_TAG" ]; then
              echo "❌ Ни у одного тега не нашлось готовой CI-сборки Build"
              exit 1
            fi
          fi

          echo "Тег ядра: $TARGET_TAG ($CORE_SHA)"

          CORE_DATE=$(gh api repos/SagerNet/sing-box/commits/$CORE_SHA -q '.commit.committer.date')
          echo "Дата коммита ядра: $CORE_DATE"

          echo "TARGET_TAG=$TARGET_TAG" >> $GITHUB_ENV
          echo "CORE_SHA=$CORE_SHA" >> $GITHUB_ENV
          echo "CORE_DATE=$CORE_DATE" >> $GITHUB_ENV

      - name: Download official libbox.aar (matching resolved tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          echo "Ищем прогон workflow Build по SHA коммита ядра: $CORE_SHA"
          RUN_ID=$(gh api "repos/SagerNet/sing-box/actions/runs?head_sha=${CORE_SHA}&status=success" \
            -q '.workflow_runs[] | select(.name=="Build") | .id' | head -n1)

          if [ -z "$RUN_ID" ]; then
            echo "❌ Успешного прогона workflow Build для коммита $CORE_SHA не нашлось"
            exit 1
          fi
          
          ARTIFACT_NAMES=$(gh api repos/SagerNet/sing-box/actions/runs/$RUN_ID/artifacts \
            -q '.artifacts[] | select(.name | test("android|aar|libbox"; "i")) | .name')

          if [ -z "$ARTIFACT_NAMES" ]; then
            echo "❌ Среди артефактов сборки $RUN_ID нет ничего похожего на android/aar/libbox"
            exit 1
          fi

          while IFS= read -r NAME; do
            echo "Скачиваю артефакт: $NAME"
            gh run download $RUN_ID -R SagerNet/sing-box -n "$NAME" -D "/tmp/artifacts/$NAME"
          done <<< "$ARTIFACT_NAMES"

          FOUND=0
          for aar_file in $(find /tmp/artifacts -type f -name "*.aar"); do
            if unzip -l "$aar_file" | grep -q "arm64-v8a/libbox.so"; then
              echo "✅ Найдено ядро $TARGET_TAG в: $aar_file"
              cp "$aar_file" app/libs/libbox.aar
              FOUND=1
              break
            fi
          done

          if [ $FOUND -eq 0 ]; then
            echo "⚠️ Готового .aar-артефакта нет — компилирую libbox.aar из исходников sing-box@$TARGET_TAG"
            echo "SKIP_PREBUILT=1" >> $GITHUB_ENV
          fi

      - name: Setup exact Android NDK 28
        if: ${{ env.SKIP_PREBUILT == '1' }}
        run: |
          echo "Устанавливаем NDK 28 для совместимости с cronet-go..."
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Build libbox.aar from source (fallback when no prebuilt .aar exists)
        if: ${{ env.SKIP_PREBUILT == '1' }}
        run: |
          set -e
          GO_VERSION="1.24.0"
          git clone --depth 1 --branch "$TARGET_TAG" https://github.com/SagerNet/sing-box.git /tmp/sing-box-src
          REQUIRED_GO=$(grep -m1 '^go ' /tmp/sing-box-src/go.mod | awk '{print $2}')
          if [ -n "$REQUIRED_GO" ]; then GO_VERSION="$REQUIRED_GO"; fi

          curl -sSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          export PATH=/usr/local/go/bin:$PATH:$(go env GOPATH)/bin
          export GOTOOLCHAIN=local

          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          gomobile init

          cd /tmp/sing-box-src
          VERSION=$(echo "$TARGET_TAG" | sed 's/^v//')
          gomobile bind -v -androidapi 21 -trimpath \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$VERSION -s -w -buildid=" \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_conntrack" \
            -target android \
            -javapkg io.nekohasekai \
            -o /tmp/sing-box-src/libbox.aar \
            ./experimental/libbox

          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp /tmp/sing-box-src/libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Auto-find newest commit of clean upstream that actually compiles
        if: ${{ github.event.inputs.app_ref == '' }}
        run: |
          MAX_ATTEMPTS=15
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            CURRENT=$(git rev-parse HEAD)
            echo "Попытка $((ATTEMPT+1))/$MAX_ATTEMPTS: пробую скомпилировать коммит $CURRENT"
            if ./gradlew :app:compileOtherDebugKotlin --no-daemon; then
              echo "✅ Коммит $CURRENT компилируется, используем его"
              break
            fi
            git reset --hard HEAD~1
            ATTEMPT=$((ATTEMPT+1))
          done
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "❌ За $MAX_ATTEMPTS попыток не нашли компилируемый коммит"
            exit 1
          fi

      - name: Inject custom shortcuts code
        run: |
          echo "==> Создаю строковые ресурсы..."
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/custom_strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="shortcut_start_short">Start</string>
              <string name="shortcut_start_long">Start VPN</string>
              <string name="shortcut_stop_short">Stop</string>
              <string name="shortcut_stop_long">Stop VPN</string>
          </resources>
          EOF

          echo "==> Создаю shortcuts.xml..."
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/xml/shortcuts.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut
                  android:shortcutId="start_vpn"
                  android:enabled="true"
                  android:icon="@drawable/ic_play_arrow_24"
                  android:shortcutShortLabel="@string/shortcut_start_short"
                  android:shortcutLongLabel="@string/shortcut_start_long">
                  <intent
                      android:action="io.nekohasekai.sfa.ACTION_START"
                      android:targetPackage="io.nekohasekai.sfa"
                      android:targetClass="io.nekohasekai.sfa.compose.MainActivity" />
              </shortcut>
              <shortcut
                  android:shortcutId="stop_vpn"
                  android:enabled="true"
                  android:icon="@drawable/ic_stop_24"
                  android:shortcutShortLabel="@string/shortcut_stop_short"
                  android:shortcutLongLabel="@string/shortcut_stop_long">
                  <intent
                      android:action="io.nekohasekai.sfa.ACTION_STOP"
                      android:targetPackage="io.nekohasekai.sfa"
                      android:targetClass="io.nekohasekai.sfa.compose.MainActivity" />
              </shortcut>
          </shortcuts>
          EOF

          echo "==> Патчу AndroidManifest.xml (meta-data для ярлыков)..."
          if ! grep -q "android.app.shortcuts" app/src/main/AndroidManifest.xml; then
            sed -i '/\.compose\.MainActivity"/,/<\/activity>/ s/<\/activity>/    <meta-data android:name="android.app.shortcuts" android:resource="@xml\/shortcuts" \/>\n        <\/activity>/' app/src/main/AndroidManifest.xml
          fi

          echo "==> Патчу вызовы в onCreate/onNewIntent..."
          sed -i 's/super\.onCreate(savedInstanceState)/super.onCreate(savedInstanceState)\n        if (handleShortcut(intent)) return/' app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt
          sed -i 's/super\.onNewIntent(intent)/super.onNewIntent(intent)\n        if (handleShortcut(intent)) return/' app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt

          echo "==> Впрыскиваю саму функцию handleShortcut перед последней закрывающей скобкой класса..."
          LAST_BRACE_LINE=$(grep -n "^}" app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt | tail -1 | cut -d: -f1)
          if [ -z "$LAST_BRACE_LINE" ]; then
            echo "❌ Не нашёл закрывающую скобку класса в MainActivity.kt — структура файла изменилась, нужно поправить скрипт"
            exit 1
          fi
          sed -i "${LAST_BRACE_LINE},\$d" app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt

          cat << 'EOF' >> app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt

              private fun handleShortcut(currentIntent: android.content.Intent?): Boolean {
                  val action = currentIntent?.action
                  if (action == "io.nekohasekai.sfa.ACTION_START") {
                      try { startService() } catch (e: Exception) {}
                      finish()
                      return true
                  } else if (action == "io.nekohasekai.sfa.ACTION_STOP") {
                      try { io.nekohasekai.sfa.bg.BoxService.stop() } catch (e: Exception) {}
                      finish()
                      return true
                  }
                  return false
              }
          }
          EOF

          echo "==> Проверка после инъекции..."
          if ! grep -q "handleShortcut" app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt; then
            echo "❌ Инъекция не удалась — handleShortcut не найден после патча"
            exit 1
          fi
          echo "✅ Инъекция успешна"

      - name: Build APK
        run: ./gradlew assembleOtherDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-debug
          path: app/build/outputs/apk/**/*.apk
