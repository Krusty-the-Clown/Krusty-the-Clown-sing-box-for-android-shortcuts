name: Build APK

"on":
  workflow_dispatch:
    inputs:
      app_ref:
        description: "App commit or branch (empty = main)"
        required: false
        default: ""
      core_ref:
        description: "sing-box tag or commit (empty = main)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_REF: ${{ github.event.inputs.app_ref }}
      CORE_REF: ${{ github.event.inputs.core_ref }}

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Checkout requested app ref
        if: ${{ env.APP_REF != '' }}
        run: |
          set -euo pipefail
          git fetch --force origin "$APP_REF"
          git checkout --detach "$APP_REF"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Build libbox.aar
        run: |
          set -euo pipefail
          NDK_VERSION=28.0.13004108
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"

          REF="$CORE_REF"
          if [ -z "$REF" ]; then
            REF=main
          fi
          rm -rf /tmp/sing-box-src
          git clone --depth 1 --branch "$REF" https://github.com/SagerNet/sing-box.git /tmp/sing-box-src

          GO_VERSION=$(awk '$1 == "go" { print $2; exit }' /tmp/sing-box-src/go.mod)
          if [ -z "$GO_VERSION" ]; then
            GO_VERSION=1.24.0
          fi
          curl --fail --location "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
          export GOTOOLCHAIN=local

          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          gomobile init

          cd /tmp/sing-box-src
          go run ./cmd/internal/build_libbox -target android
          AAR_PATH=$(find . -maxdepth 1 -type f -name libbox.aar -print -quit)
          if [ -z "$AAR_PATH" ]; then
            echo "libbox.aar was not created"
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp "$AAR_PATH" "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Add shortcut resources and handlers
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/values app/src/main/res/xml

          cat > app/src/main/res/values/custom_strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="shortcut_start_short">Start</string>
              <string name="shortcut_start_long">Start VPN</string>
              <string name="shortcut_stop_short">Stop</string>
              <string name="shortcut_stop_long">Stop VPN</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/shortcuts.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut
                  android:shortcutId="start_vpn"
                  android:enabled="true"
                  android:icon="@drawable/ic_play_arrow_24"
                  android:shortcutShortLabel="@string/shortcut_start_short"
                  android:shortcutLongLabel="@string/shortcut_start_long">
                  <intent
                      android:action="io.nekohasekai.sfa.ACTION_START"
                      android:targetPackage="io.nekohasekai.sfa"
                      android:targetClass="io.nekohasekai.sfa.compose.MainActivity" />
              </shortcut>
              <shortcut
                  android:shortcutId="stop_vpn"
                  android:enabled="true"
                  android:icon="@drawable/ic_stop_24"
                  android:shortcutShortLabel="@string/shortcut_stop_short"
                  android:shortcutLongLabel="@string/shortcut_stop_long">
                  <intent
                      android:action="io.nekohasekai.sfa.ACTION_STOP"
                      android:targetPackage="io.nekohasekai.sfa"
                      android:targetClass="io.nekohasekai.sfa.compose.MainActivity" />
              </shortcut>
          </shortcuts>
          EOF

          python3 <<'PY'
          from pathlib import Path

          manifest_path = Path("app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text()
          if "android.app.shortcuts" not in manifest:
              activity = '<activity\n            android:name=".compose.MainActivity"'
              start = manifest.find(activity)
              if start == -1:
                  raise SystemExit("MainActivity declaration not found")
              end = manifest.find("</activity>", start)
              if end == -1:
                  raise SystemExit("MainActivity closing tag not found")
              metadata = '            <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />\n'
              manifest = manifest[:end] + metadata + manifest[end:]
              manifest_path.write_text(manifest)

          activity_path = Path("app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt")
          source = activity_path.read_text()
          marker = """        if (intent == null) {
              return
          }
          """
          call = """        if (handleShortcutIntent(intent)) {
              return
          }
          """
          if "handleShortcutIntent(intent)" not in source:
              if marker not in source:
                  raise SystemExit("Intent handler anchor not found")
              source = source.replace(marker, marker + call, 1)

          if "private fun handleShortcutIntent(" not in source:
              method = """
          private fun handleShortcutIntent(currentIntent: Intent): Boolean {
              return when (currentIntent.action) {
                  "io.nekohasekai.sfa.ACTION_START" -> {
                      startService()
                      true
                  }
                  "io.nekohasekai.sfa.ACTION_STOP" -> {
                      runCatching { BoxService.stop() }
                          .onFailure { Log.w("MainActivity", "Shortcut stop failed", it) }
                      finish()
                      true
                  }
                  else -> false
              }
          }
          """
              end = source.rfind("\n}")
              if end == -1:
                  raise SystemExit("MainActivity class end not found")
              source = source[:end] + method + source[end:]

          activity_path.write_text(source)
          PY

      - name: Validate modified app
        run: ./gradlew :app:compileOtherDebugKotlin --no-daemon

      - name: Build APK
        run: ./gradlew assembleOtherDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
