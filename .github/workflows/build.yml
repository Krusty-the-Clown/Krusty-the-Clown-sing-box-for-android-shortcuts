name: Build APK

"on":
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Коммит или ветка приложения (пусто = HEAD main)"
        required: false
        default: ""
        type: string
      core_tag:
        description: "Тег или commit SHA sing-box (пусто = автоматический поиск)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_REF: ${{ inputs.app_ref }}
      CORE_TAG_INPUT: ${{ inputs.core_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
          fetch-depth: 0

      - name: Checkout requested app ref
        if: ${{ env.APP_REF != '' }}
        run: |
          set -euo pipefail
          git fetch --force origin "$APP_REF"
          git checkout --detach "$APP_REF"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve core tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$CORE_TAG_INPUT" ]; then
            TARGET_TAG="$CORE_TAG_INPUT"
            if [[ "$TARGET_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
              CORE_SHA=$(gh api "repos/SagerNet/sing-box/git/ref/tags/$TARGET_TAG" -q '.object.sha')
            else
              CORE_SHA=$(gh api "repos/SagerNet/sing-box/commits/$TARGET_TAG" -q '.sha')
            fi
          else
            TARGET_TAG=$(gh api repos/SagerNet/sing-box/tags --paginate | jq -r '
              [.[] | select(.name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-(beta|rc)\\.[0-9]+)?$"))
               | . + {p: (.name | capture("^v(?<a>[0-9]+)\\.(?<b>[0-9]+)\\.(?<c>[0-9]+)(-(?<s>beta|rc)\\.(?<n>[0-9]+))?$"))}
               | . + {score: ((.p.a|tonumber)*1000000000 + (.p.b|tonumber)*1000000 + (.p.c|tonumber)*1000 + (if .p.s == null then 900 elif .p.s == "rc" then 500 + (.p.n|tonumber) else (.p.n|tonumber) end))}
              ] | sort_by(-.score) | .[0].name')
            [ -n "$TARGET_TAG" ] || { echo 'No sing-box tag found'; exit 1; }
            CORE_SHA=$(gh api "repos/SagerNet/sing-box/git/ref/tags/$TARGET_TAG" -q '.object.sha')
          fi
          [ -n "$CORE_SHA" ] && [ "$CORE_SHA" != null ] || { echo 'Could not resolve sing-box ref'; exit 1; }
          printf 'TARGET_TAG=%s\nCORE_SHA=%s\n' "$TARGET_TAG" "$CORE_SHA" >> "$GITHUB_ENV"

      - name: Download official libbox.aar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/libs /tmp/artifacts
          RUN_ID=$(gh api "repos/SagerNet/sing-box/actions/runs?head_sha=$CORE_SHA&status=success&per_page=100" -q '.workflow_runs[] | select(.name == "Build") | .id' | head -n1 || true)
          FOUND=0
          if [ -n "$RUN_ID" ]; then
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              gh run download "$RUN_ID" -R SagerNet/sing-box -n "$name" -D "/tmp/artifacts/$name"
            done < <(gh api "repos/SagerNet/sing-box/actions/runs/$RUN_ID/artifacts?per_page=100" -q '.artifacts[] | select(.name | test("android|aar|libbox"; "i")) | .name')
            while IFS= read -r -d '' file; do
              if unzip -l "$file" | grep -q 'arm64-v8a/libbox.so'; then
                cp "$file" app/libs/libbox.aar
                FOUND=1
                break
              fi
            done < <(find /tmp/artifacts -type f -name '*.aar' -print0)
          fi
          if [ "$FOUND" -eq 0 ]; then
            echo 'SKIP_PREBUILT=1' >> "$GITHUB_ENV"
          fi

      - name: Build libbox.aar from source
        if: ${{ env.SKIP_PREBUILT == '1' }}
        run: |
          set -euo pipefail
          NDK_VERSION=28.0.13004108
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" >/dev/null
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          git clone --depth 1 --branch "$TARGET_TAG" https://github.com/SagerNet/sing-box.git /tmp/sing-box-src
          GO_VERSION=$(awk '$1 == "go" { print $2; exit }' /tmp/sing-box-src/go.mod)
          GO_VERSION=${GO_VERSION:-1.24.0}
          curl --fail --location "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
          export GOTOOLCHAIN=local
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          gomobile init
          cd /tmp/sing-box-src
          go run ./cmd/internal/build_libbox -target android
          cp "$(find . -maxdepth 1 -name libbox.aar -print -quit)" "$GITHUB_WORKSPACE/app/libs/libbox.aar"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Find newest compiling app commit
        if: ${{ env.APP_REF == '' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if ./gradlew :app:compileOtherDebugKotlin --no-daemon; then
              break
            fi
            git rev-parse --verify HEAD~1 >/dev/null || exit 1
            git reset --hard HEAD~1
            [ "$attempt" -lt 15 ] || exit 1
          done

      - name: Inject VPN shortcuts
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/values app/src/main/res/xml
          cat > app/src/main/res/values/custom_strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="shortcut_start_short">Start</string>
              <string name="shortcut_start_long">Start VPN</string>
              <string name="shortcut_stop_short">Stop</string>
              <string name="shortcut_stop_long">Stop VPN</string>
          </resources>
          EOF
          cat > app/src/main/res/xml/shortcuts.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut android:shortcutId="start_vpn" android:enabled="true" android:icon="@drawable/ic_play_arrow_24" android:shortcutShortLabel="@string/shortcut_start_short" android:shortcutLongLabel="@string/shortcut_start_long">
                  <intent android:action="io.nekohasekai.sfa.ACTION_START" android:targetPackage="io.nekohasekai.sfa" android:targetClass="io.nekohasekai.sfa.compose.MainActivity" />
              </shortcut>
              <shortcut android:shortcutId="stop_vpn" android:enabled="true" android:icon="@drawable/ic_stop_24" android:shortcutShortLabel="@string/shortcut_stop_short" android:shortcutLongLabel="@string/shortcut_stop_long">
                  <intent android:action="io.nekohasekai.sfa.ACTION_STOP" android:targetPackage="io.nekohasekai.sfa" android:targetClass="io.nekohasekai.sfa.compose.MainActivity" />
              </shortcut>
          </shortcuts>
          EOF
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.app.shortcuts' not in text:
              start = text.index('<activity\n            android:name=".compose.MainActivity"')
              end = text.index('</activity>', start)
              text = text[:end] + '            <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" />\n' + text[end:]
              manifest.write_text(text)
          path = Path('app/src/main/java/io/nekohasekai/sfa/compose/MainActivity.kt')
          text = path.read_text()
          marker = '''        if (intent == null) {
            return
        }
'''
          if 'handleShortcutIntent(intent)' not in text:
              text = text.replace(marker, marker + '''        if (handleShortcutIntent(intent)) {
            return
        }
''', 1)
          if 'private fun handleShortcutIntent(' not in text:
              function = '''
    private fun handleShortcutIntent(currentIntent: Intent): Boolean {
        return when (currentIntent.action) {
            "io.nekohasekai.sfa.ACTION_START" -> {
                startService()
                true
            }
            "io.nekohasekai.sfa.ACTION_STOP" -> {
                runCatching { BoxService.stop() }
                    .onFailure { Log.w("MainActivity", "Shortcut stop failed", it) }
                finish()
                true
            }
            else -> false
        }
    }
'''
              text = text[:text.rfind('\n}')] + function + text[text.rfind('\n}'):]
          path.write_text(text)
          PY

      - name: Validate injected Kotlin
        run: ./gradlew :app:compileOtherDebugKotlin --no-daemon

      - name: Build APK
        run: ./gradlew assembleOtherDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
